[project]
name = "citegap"
version = "0.1.0"
description = "AI-readability x search-visibility auditor built on TinyFish Search and Fetch"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "selectolax>=0.3",
  "pydantic>=2.6",
  "rapidfuzz>=3.6",
  "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
citegap = "citegap.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
